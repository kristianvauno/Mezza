<!DOCTYPE html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mezza Agents in General Santos City</title>
  <meta name="description" content="Browse verified Mezza agents and rent managers in General Santos City.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="agents">
  <header id="site-header" class="site-header"></header>
  <main class="wrap page-hero">
    <p class="eyebrow">Meet the desk</p>
    <h1>Agents in GenSan</h1>
    <p class="lede">Public profiles, ratings, and listings. Chat stays on Mezza.</p>
    <div class="agent-grid" id="agent-grid" style="margin-top:28px"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/platform.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("agent-grid").innerHTML = getPublicAgents().map(function (a) {
        return '<a class="agent-card" href="agent.html?e=' + encodeURIComponent(a.email) + '">' +
          (a.photo ? '<img src="' + a.photo + '" alt="">' : '<div class="agent-fallback">' + (a.name || "?").charAt(0) + "</div>") +
          "<div><h3>" + (a.verified ? "✓ " : "") + a.name + "</h3>" +
          '<p class="tiny">' + (a.agency || "Independent") + " · " + (a.city || "General Santos City") + "</p>" +
          '<p class="tiny">' + a.rating + " ★ · " + a.listingCount + " listings · Member since " + (a.created || "").slice(0, 4) + "</p></div></a>";
      }).join("");
    });
  </script>
</body>
</html>
