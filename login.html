<!DOCTYPE html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Mezza</title>
  <meta name="description" content="Sign in to Mezza to save homes and manage your General Santos City listing inquiries.">
  <link rel="canonical" href="https://mezza.ph/login.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <header id="site-header" class="site-header"></header>
  <main class="wrap page-hero" style="max-width: 480px;">
    <p class="eyebrow">Account</p>
    <h1>Login</h1>
    <p class="lede">Sign in to save listings and pick up where you left off.</p>
    <form class="form-card" id="login-form" style="margin-top: 22px;">
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field" style="margin-top: 12px;">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button class="btn btn-clay btn-full" type="submit" style="margin-top: 18px;">Login</button>
      <p class="tiny" style="margin-top: 12px;">No account yet? <a href="signup.html">Sign up</a></p>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (currentUser()) {
        location.replace("listings.html");
        return;
      }
      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("login-email").value.trim();
        var pass = document.getElementById("login-password").value;
        var account = getAccounts().find(function (a) {
          return a.email.toLowerCase() === email.toLowerCase() && a.password === pass;
        });
        if (!account) {
          alert("No profile matches that email and password. Sign up first.");
          return;
        }
        setSession(email);
        location.href = "profile.html";
      });
    });
  </script>
</body>
</html>
